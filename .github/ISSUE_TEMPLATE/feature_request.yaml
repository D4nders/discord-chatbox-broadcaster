name: 💡 Feature / Improvement
description: Suggest an improvement, config option, or general feature
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
      description: Describe the feature or improvement you'd like to add.
      placeholder: "e.g., Warn the player in the chatbox if their OSRS settings for Collection Log notifications are disabled..."
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Additional Details / Mockups (Optional)
      description: Any extra context, config toggle ideas, or screenshots.
    validations:
      required: false
