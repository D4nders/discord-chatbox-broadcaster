name: 🐛 Bug Report
description: Report a broadcast that didn't trigger, parsed wrong, or behaved unexpectedly
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: feature
    attributes:
      label: Affected Feature
      description: Which broadcast or feature is affected?
      options:
        - Personal Bests (PB / Fight Duration)
        - Combat Achievements
        - Achievement Diaries
        - Collection Log
        - Valuable Drops
        - Pets
        - Level Ups / XP Milestones
        - Quests
        - Player Kills / Deaths
        - Discord Webhook / Image Rendering
        - Other
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Briefly describe what went wrong or what you expected to happen.
      placeholder: "e.g., ToA completion time was posted without the raid name..."
    validations:
      required: true

  - type: textarea
    id: chat-message
    attributes:
      label: In-Game Chat Message / Screenshot (Optional)
      description: Paste the exact OSRS chatbox message (or drag & drop a screenshot of the chatbox / Discord output) if you have it.
      placeholder: "e.g., Tombs of Amascut total completion time: 20:31 (new personal best)"
    validations:
      required: false